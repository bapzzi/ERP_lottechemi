<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, initial-scale=1" />
  <title>롯데케미칼 SAP S/4HANA 통합 ERP 사례 — 인쇄용 (PDF 변환)</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../shared/style.css" />

  <style id="print-style">
    /* ========== 1920×1080 인쇄 영역 — 모든 슬라이드 일렬 펼침 ========== */
    @page {
      size: 1920px 1080px;
      margin: 0;
    }

    /* html·body 영역 — 스크롤 가능 + 고정 영역 해제 (shared/style.css override) */
    html, body {
      width: auto !important;
      height: auto !important;
      min-height: 100% !important;
      overflow: visible !important;
      overflow-x: hidden !important;
      background: #2a2a2a !important;
      background-image: none !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* .stage 영역 — fixed 해제·static·세로 스크롤 가능 */
    .stage {
      position: static !important;
      width: auto !important;
      height: auto !important;
      overflow: visible !important;
      display: block !important;
    }

    /* .deck 영역 — absolute 해제·세로 적층 */
    .deck {
      position: static !important;
      width: 1920px !important;
      height: auto !important;
      margin: 0 auto !important;
      transform: none !important;
      box-shadow: none !important;
      background: transparent !important;
      display: block !important;
      padding: 0 !important;
    }

    /* .slide 영역 — absolute inset:0 해제·세로 적층·각자 1920×1080 */
    .slide {
      display: block !important;
      position: relative !important;
      inset: auto !important;
      top: auto !important;
      left: auto !important;
      right: auto !important;
      bottom: auto !important;
      width: 1920px !important;
      height: 1080px !important;
      margin: 20px auto !important;
      background: var(--color-paper) !important;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      opacity: 1 !important;
      transform: none !important;
      page-break-after: always;
      page-break-inside: avoid;
      overflow: hidden;
    }
    .slide:last-child {
      page-break-after: auto;
    }

    /* 모든 reveal·animation 영역 final 상태 강제 */
    .reveal,
    [class*="reveal"] {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
    }
    .slide *,
    .slide *::before,
    .slide *::after {
      animation-duration: 0s !important;
      animation-delay: 0s !important;
      animation-iteration-count: 1 !important;
      animation-fill-mode: forwards !important;
    }

    /* hint 영역 (인쇄·스크린 둘 다 X) */
    .hint {
      display: none !important;
    }

    /* 인쇄 영역 — 그림자·여백 X */
    @media print {
      html, body {
        background: white !important;
        overflow: visible !important;
      }
      .stage,
      .deck {
        background: transparent !important;
      }
      .slide {
        margin: 0 !important;
        box-shadow: none !important;
      }
    }

    /* 로딩 영역 표시 */
    .deck:empty::before {
      content: '인쇄용 자료 로딩 중... (5 step fetch + inject · 잠시 기다려주세요)';
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100vh;
      font-family: var(--font-sans);
      font-size: 28px;
      font-weight: 700;
      color: var(--color-ink-soft);
      background: var(--color-paper);
    }

    /* 인쇄 안내 (스크린만) */
    .print-guide {
      position: fixed;
      top: 16px;
      right: 16px;
      padding: 12px 18px;
      background: var(--color-red);
      color: var(--color-paper);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 700;
      border-radius: 4px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      z-index: 9999;
      max-width: 380px;
      line-height: 1.5;
    }
    .print-guide strong {
      display: block;
      font-size: 16px;
      font-weight: 900;
      margin-bottom: 4px;
    }
    .print-guide kbd {
      display: inline-block;
      padding: 2px 6px;
      background: var(--color-paper);
      color: var(--color-red);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 800;
      border-radius: 3px;
      margin: 0 2px;
    }
    @media print {
      .print-guide { display: none !important; }
    }
  </style>
</head>
<body>

<div class="print-guide">
  <strong>인쇄용 진입점</strong>
  <kbd>Cmd</kbd>+<kbd>P</kbd> · 용지 크기 "맞춤" 1920×1080 · 여백 "없음" → "PDF로 저장"
</div>

<div class="stage">
  <div class="deck" id="deck">
    <!-- print.js가 5 step의 모든 section을 fetch + inject -->
  </div>
</div>

<script src="print.js"></script>

</body>
</html>
