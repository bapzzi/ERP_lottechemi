<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>02 · 발표 흐름 — 롯데케미칼 SAP S/4HANA</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/style.css" />
  <style>
    /* 02 toc 전용 — component-catalog §7-2 정합 */
    .toc-main {
      position: relative;
      z-index: 3;
      padding: 84px var(--slide-padding-x) 0;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: var(--sp-7);
      height: 864px;
    }
    .toc-headline {
      font-family: var(--font-sans);
      font-size: 60px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--color-ink-strong);
      margin-top: var(--sp-4);
    }
    .toc-headline .toc-em { color: var(--color-red); }
    .toc-list {
      display: grid;
      grid-template-rows: repeat(5, 1fr);
      gap: var(--sp-4);
      padding-top: var(--sp-5);
      border-top: 1px solid var(--color-line);
    }
    .toc-item {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: var(--sp-6);
      align-items: center;
      padding: var(--sp-4) 0;
      border-bottom: 1px solid var(--color-line-soft);
    }
    .toc-item:last-child { border-bottom: none; }
    .toc-num {
      font-family: var(--font-mono);
      font-size: 30px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--color-ink-mute);
    }
    .toc-title {
      font-family: var(--font-sans);
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--color-ink-strong);
    }
  </style>
</head>
<body>
<div class="stage" id="stage">
  <div class="deck" id="deck">
    <section class="slide tone-b active" data-slide="2">
      <header class="slide-head">
        <div class="brand">
          <img class="brand-logo" src="../shared/lotte-chemical-logo.jpeg" alt="롯데케미칼 로고" />
        </div>
        <div class="head-meta">
          <span class="hm-item">광운대학교 경영대학</span>
          <span class="hm-dot"></span>
          <span class="hm-item">ERP개론</span>
          <span class="hm-dot"></span>
          <span class="hm-item">기업 통합 ERP 사례 분석</span>
        </div>
        <div class="head-page">
          <span class="hp-num">02</span>
        </div>
      </header>
      <main class="toc-main">
        <div>
          <div class="eyebrow reveal" style="--rev-delay:0.1s">
            <span class="eb-bar"></span>
            <span class="eb-text">발표 흐름</span>
          </div>
          <h1 class="toc-headline reveal" style="--rev-delay:0.3s">
            이 발표는 <span class="toc-em">5부</span>로 흐른다
          </h1>
        </div>
        <ol class="toc-list">
          <li class="toc-item reveal" style="--rev-delay:0.5s">
            <span class="toc-num">1부</span>
            <span class="toc-title">왜 ERP 통합이 필요했는가</span>
          </li>
          <li class="toc-item reveal" style="--rev-delay:0.65s">
            <span class="toc-num">2부</span>
            <span class="toc-title">어떻게 도입할 것인가</span>
          </li>
          <li class="toc-item reveal" style="--rev-delay:0.80s">
            <span class="toc-num">3부</span>
            <span class="toc-title">7개월의 구축</span>
          </li>
          <li class="toc-item reveal" style="--rev-delay:0.95s">
            <span class="toc-num">4부</span>
            <span class="toc-title">가동 이후의 검증</span>
          </li>
          <li class="toc-item reveal" style="--rev-delay:1.10s">
            <span class="toc-num">5부</span>
            <span class="toc-title">무엇을 배우는가</span>
          </li>
        </ol>
      </main>
      <footer class="slide-foot">
        <span class="sf-left">2017.04 — 2017.11 · 총 7개월</span>
        <span class="sf-mid">광운대학교 경영대학 ERP개론 · 1팀</span>
        <span class="sf-right">2026.05.29 발표</span>
      </footer>
    </section>
  </div>
</div>
<div class="hint">
  <span class="hint-key">F</span><span class="hint-txt">전체화면</span>
  <span class="hint-sep"></span>
  <span class="hint-key">R</span><span class="hint-txt">애니메이션 재생</span>
</div>
<script src="../shared/script.js"></script>
</body>
</html>
