<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>03 · 1부 진입 — 왜 ERP 통합이 필요했는가</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/style.css" />
  <style>
    /* 03 part1-intro 전용 — CLAUDE.md §3-1 챕터 진입 cream 톤 */
    .part-intro-slide { background: var(--color-bg-cream); }
    .part-intro-main {
      position: relative;
      z-index: 3;
      padding: 100px var(--slide-padding-x) 0;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: var(--sp-8);
      height: 864px;
      align-items: start;
    }
    .part-intro-left {
      display: flex;
      flex-direction: column;
      gap: var(--sp-5);
      padding-top: var(--sp-4);
    }
    .part-num {
      font-family: var(--font-mono);
      font-size: 88px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--color-red);
      line-height: 1;
    }
    .part-title {
      font-family: var(--font-sans);
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink-strong);
    }
    .part-intro-right {
      padding-top: var(--sp-6);
      border-left: 1px solid var(--color-line);
      padding-left: var(--sp-8);
    }
    .part-preview-label {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-ink-mute);
      margin-bottom: var(--sp-5);
    }
    .part-preview-list {
      display: grid;
      grid-template-rows: repeat(5, auto);
      gap: var(--sp-4);
    }
    .part-preview-item {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: var(--sp-5);
      align-items: baseline;
      padding: var(--sp-3) 0;
      border-bottom: 1px solid var(--color-line-soft);
    }
    .part-preview-item:last-child { border-bottom: none; }
    .pp-num {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--color-ink-mute);
    }
    .pp-text {
      font-family: var(--font-sans);
      font-size: 19px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--color-ink);
      line-height: 1.45;
    }
  </style>
</head>
<body>
<div class="stage" id="stage">
  <div class="deck" id="deck">
    <section class="slide tone-b part-intro-slide active" data-slide="3">
      <header class="slide-head">
        <div class="brand">
          <img class="brand-logo" src="../shared/lotte-chemical-logo.jpeg" alt="롯데케미칼 로고" />
        </div>
        <div class="head-meta">
          <span class="hm-item">광운대학교 경영대학</span>
          <span class="hm-dot"></span>
          <span class="hm-item">ERP개론</span>
          <span class="hm-dot"></span>
          <span class="hm-item">기업 통합 ERP 사례 분석</span>
        </div>
        <div class="head-page">
          <span class="hp-num">03</span>
        </div>
      </header>
      <main class="part-intro-main">
        <div class="part-intro-left">
          <span class="part-num reveal" style="--rev-delay:0.1s">1부</span>
          <h1 class="part-title reveal" style="--rev-delay:0.35s">왜 ERP 통합이<br />필요했는가</h1>
        </div>
        <div class="part-intro-right">
          <div class="part-preview-label reveal" style="--rev-delay:0.55s">1부에서 다룰 내용</div>
          <ol class="part-preview-list">
            <li class="part-preview-item reveal" style="--rev-delay:0.70s">
              <span class="pp-num">01</span>
              <span class="pp-text">분석 대상 — 롯데케미칼, 글로벌 종합화학기업</span>
            </li>
            <li class="part-preview-item reveal" style="--rev-delay:0.85s">
              <span class="pp-num">02</span>
              <span class="pp-text">호황기 재무 — 사상 최대 실적 시기의 ERP 통합</span>
            </li>
            <li class="part-preview-item reveal" style="--rev-delay:1.00s">
              <span class="pp-num">03</span>
              <span class="pp-text">17년 SAP 자산 + M&amp;A 통합 압력</span>
            </li>
            <li class="part-preview-item reveal" style="--rev-delay:1.15s">
              <span class="pp-num">04</span>
              <span class="pp-text">석유화학 산업 6대 특성</span>
            </li>
            <li class="part-preview-item reveal" style="--rev-delay:1.30s">
              <span class="pp-num">05</span>
              <span class="pp-text">정보화 제약과 ERP 필요성</span>
            </li>
          </ol>
        </div>
      </main>
      <footer class="slide-foot">
        <span class="sf-left">2017.04 — 2017.11 · 총 7개월</span>
        <span class="sf-mid">광운대학교 경영대학 ERP개론 · 1팀</span>
        <span class="sf-right">2026.05.29 발표</span>
      </footer>
    </section>
  </div>
</div>
<div class="hint">
  <span class="hint-key">F</span><span class="hint-txt">전체화면</span>
  <span class="hint-sep"></span>
  <span class="hint-key">R</span><span class="hint-txt">애니메이션 재생</span>
</div>
<script src="../shared/script.js"></script>
</body>
</html>
