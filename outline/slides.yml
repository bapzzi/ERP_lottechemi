  # ========== 챕터 5 · 결론 ==========
  - id: "28"
    slug: conclusion
    title: 결론 — ERP가 아니라 통합 경영 기반
    tone: tone-a
    chapter: "5. 결론"
    status: draft
    core_message: "롯데케미칼의 ERP 전환은 시스템을 바꾼 프로젝트가 아니라, M&A 이후 하나의 회사처럼 운영하기 위한 통합 경영 기반을 만든 프로젝트였다."
    must_include:
      - 중앙 결론 변주 문장 (content-thesis §1)
      - 성공 요인 3개 압축 (기존 SAP 자산을 버리지 않았다 / 다운타임 리스크를 사전에 통제했다 / 표준화와 차별성을 동시에 관리했다)
      - "하단 17년 진화 흐름: 2003 SMART → 2010 GEMS → 2017 S/4HANA → 2018 DT 협의체 → 2030 톱7 비전"
    speaker_notes:
      - 기존 SAP 자산 보유 기업 시사점 — "전환 시기를 미루는 것보다 기존 자산을 어떻게 진화시킬지 검토하는 것이 중요"
      - ERP는 단독 시스템이 아니라 통합 경영 플랫폼이라는 보조 메시지 (보강 E)
      - 본질적 통찰 3가지 (Step5 §5)
    visual:
      type: conclusion-composite
      layout: 중앙 결론 + 보조 영역 좌우 + 하단 진화 흐름
      components_needs_approval: [timeline]
    notes:
      - 화면 정보 과밀 금지
      - 표지(01)와 호응
      - 22번(보강 D) 회수
      - Step5 합의 응축
      - 결론은 표지 메시지를 회수하는 역할이 우선
    decision_sources: [Step5 합의, 보강 E, 보강 D 회수]
    evidence_sources: [본문 전체 회수, content-thesis §1]
