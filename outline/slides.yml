  version: v2.0
  note: |
    v1.0(28장 골조)에서 v2.0(57장 dist 빌드 기준)으로 전면 정합 (2026.05.29·v2.18 차수).
    hp-num(청중 노출 페이지 번호)은 01~57 연속. dist의 <!-- SLIDE NN --> 주석 번호는
    옛 번호라 화면 순서와 다를 수 있으며, 본 지도는 hp-num(화면 순서) 기준이다.

