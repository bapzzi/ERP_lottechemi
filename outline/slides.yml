tone_distribution:
  tone_a: 2
  tone_b: 10
  tone_c: 45
  note: |
    Tone A = 표지(01)·발표 마감(57). Tone B = 목차·Step 진입·분석 도입 영역.
    Tone C = 데이터·표·분석 본문 (본 발표가 분석·검증 서사 성격이라 C 비중이 높음).
    tone-system §5 가이드는 권장이며 강제 아님.

